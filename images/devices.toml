# One physical model (build-media.yml's matrix): its variant plus per-model
# runtime defaults. Build-time only; the build generates from it:
#   - default-rotation.json (12-default-rotation.py): kioskd substring-matches
#     dmi_product against DMI product_name; used until set in Settings.
#     Unknown hardware gets [default]'s.
#   - the boot splash's rotation (20-panel-orientation.py): from rotation,
#     on panel_connector, so the first boot already matches it.
# name is for humans only.
#
# rotation: "portrait" | "landscape" (from the panel's native mode), or a
# wlr-randr transform: "normal" | "90" | "180" | "270" -- a transform when
# panel_connector is set (the panel's native mode isn't known at build time).

[default]
rotation = "landscape"

[hp-pro-tablet-408]
name = "HP Pro Tablet 408 G1 (Intel Atom Z3736F, 32-bit UEFI)"
variant = "x86"
dmi_product = "HP Pro Tablet 408"
# A portrait 800x1280 panel: "270" is landscape (as "90"), turned the other way.
rotation = "270"
# Firmware only boots EFI/BOOT/BOOTIA32.EFI (checked in build-media.yml).
efi_ia32 = true
# The built-in panel's connector: the boot splash turns with rotation on it.
panel_connector = "DSI-1"
