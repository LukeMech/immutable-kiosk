# A device (what build-media.yml matrixes over) is one physical model: which
# variant it runs, plus the few runtime defaults that differ per model.
#
# Build-time only -- not in the image. From it the build generates:
#   - /usr/lib/immutable-kiosk/default-rotation.json (build_files/
#     12-default-rotation.py): dmi_product -> rotation for the variant's
#     devices; kioskd matches dmi_product against /sys/class/dmi/id/
#     product_name (substring) and uses it until a rotation is set in
#     Settings. Unknown hardware gets [default]'s.
#   - the panel-orientation kernel argument (images/<variant>/build_files/
#     20-panel-orientation.py).
# name is for people reading this file; Settings shows what DMI reports.
#
# rotation: "portrait" | "landscape" (picked from the panel's native mode at
# runtime), or a fixed wlr-randr transform: "normal" | "90" | "180" | "270".

[default]
rotation = "landscape"

[hp-pro-tablet-408]
name = "HP Pro Tablet 408 G1 (Intel Atom Z3736F, 32-bit UEFI)"
variant = "x86"
dmi_product = "HP Pro Tablet 408"
rotation = "landscape"
# The firmware only boots EFI/BOOT/BOOTIA32.EFI: the disk image and the ISO
# both get checked for it in build-media.yml.
efi_ia32 = true
# Boot splash (Plymouth) and kernel console orientation: the panel is a
# portrait 800x1280 one mounted sideways, its top on the left. (right_side_up
# showed everything upside down on the tablet.) Becomes the kernel argument
# video=DSI-1:panel_orientation=left_side_up for this variant
# (images/x86/build_files/20-panel-orientation.py). Values: normal,
# upside_down, left_side_up, right_side_up.
panel_connector = "DSI-1"
panel_orientation = "left_side_up"
