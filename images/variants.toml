# A variant (what build.yml matrixes over) is one OS image:
# images/<suffix>/{build_files,system_files}/, package "immutable-kiosk-<suffix>".
#
# Not tied to one device -- devices.toml entries pick a variant.

[x86]
suffix = "x86"
description = "x86_64 tablets and panel PCs, including ones with 32-bit UEFI (Intel Bay Trail / Cherry Trail)"
