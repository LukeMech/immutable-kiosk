# immutable-kiosk x86: drivers for hardware the kiosk never uses, which only
# cost boot time and log errors on the HP Pro Tablet 408:
# - hp_bioscfg: HP's BIOS-settings WMI interface. Its probe runs the
#   firmware's broken WMI methods ("ACPI BIOS Error ... \_SB.WMID.WQBC",
#   "hp_bioscfg: Returned error 0x4, Invalid command type").
# - bmc150 accelerometer/magnetometer: rotation is set in Settings, nothing
#   reads them ("supply vdd not found, using dummy regulator"). Drop these
#   two lines for auto-rotation (ROADMAP).
blacklist hp_bioscfg
blacklist bmc150_accel_i2c
blacklist bmc150_accel_core
blacklist bmc150_magn_i2c
blacklist bmc150_magn
