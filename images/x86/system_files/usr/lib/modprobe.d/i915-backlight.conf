# Bay Trail/Cherry Trail: the panel backlight is an LPSS PWM that i915 looks
# up once, at probe. With i915 in the initramfs (early KMS, images/x86/
# initramfs.sh) it can win the race against the PWM driver and come up with
# no intel_backlight. Load the PWM driver first (a no-op on hardware without
# the LPSS PWM: the module loads, nothing binds).
softdep i915 pre: pwm-lpss-platform
