# Bay Trail/Cherry Trail: the panel backlight is an LPSS PWM that i915 looks
# up once, at probe. If i915 wins the race against the PWM driver it comes up
# with no intel_backlight (Settings' brightness slider dead) -- seen with
# i915 in the initramfs, possible during udev's coldplug too. Load the PWM
# driver first (a no-op on hardware without the LPSS PWM: the module loads,
# nothing binds).
softdep i915 pre: pwm-lpss-platform
