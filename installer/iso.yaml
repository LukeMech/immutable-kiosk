# image-builder's ISO config: volume label and the boot menu.
#
# root=live:CDLABEL must name the same label. At most 11 characters: Rufus
# "ISO mode" copies the ISO onto FAT32, whose labels are cut to 11 (a
# longer one boots into a dracut emergency shell); check-iso.sh enforces it.
# rd.live.dir/rd.live.squashimg say where image-builder put the root
# squashfs on the ISO --
# scripts/check-iso.sh verifies that path exists in every built ISO and fails
# the build otherwise, so a layout change upstream can't ship an ISO that
# boots into an emergency shell.
#
# selinux=0: the live root comes straight from the container's files, which
# carry no SELinux labels on the ISO (same as lm-server's installer).
label: "IMMKIOSK"
grub2:
  entries:
    - name: "Instalator immutable-kiosk"
      linux: "/images/pxeboot/vmlinuz root=live:CDLABEL=IMMKIOSK rd.live.image rd.live.dir=LiveOS rd.live.squashimg=squashfs.img selinux=0 quiet loglevel=3 vt.global_cursor_default=0"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Instalator immutable-kiosk (podstawowa grafika)"
      linux: "/images/pxeboot/vmlinuz root=live:CDLABEL=IMMKIOSK rd.live.image rd.live.dir=LiveOS rd.live.squashimg=squashfs.img selinux=0 nomodeset"
      initrd: "/images/pxeboot/initrd.img"
