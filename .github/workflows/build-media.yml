name: Build installer ISOs

# Called by build.yml and promote.yml (attaches to the release), or by hand
# (artifacts only, unless publish + tag). The installed system follows
# image_tag, so a dev ISO installs a dev-channel kiosk.
#
# Per device in images/devices.toml: raw disk image (shrunk, ia32 EFI files
# ensured) -> installer payload -> installer container -> ISO (+ ia32 boot
# files if needed) -> checked, split if >= 2 GiB, attached. Only the ISO is
# released.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach to an existing release"
        type: boolean
        default: false
      tag:
        description: "Existing release tag (required if publish is checked)"
        type: string
        default: ""
      image_tag:
        description: "Image tag to install and follow (latest = stable, dev)"
        type: string
        default: "latest"
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      tag:
        type: string
        default: ""
      image_tag:
        type: string
        default: "latest"

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: ${{ inputs.image_tag || 'latest' }}
  LOCAL_REGISTRY: "localhost:5000"

concurrency:
  group: build-media-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover devices
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.list.outputs.devices }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: List devices
        id: list
        run: |
          set -euo pipefail
          devices=$(python3 -c '
          import json, tomllib
          with open("images/devices.toml", "rb") as f:
              data = tomllib.load(f)
          print(json.dumps(sorted(k for k, v in data.items() if k != "default" and "variant" in v)))
          ')
          echo "Discovered devices: ${devices}"
          echo "devices=${devices}" >> "$GITHUB_OUTPUT"

  build:
    name: Build media (${{ matrix.device }})
    needs: discover
    strategy:
      matrix:
        device: ${{ fromJson(needs.discover.outputs.devices) }}
      fail-fast: false
    # Not 26.04: osbuild can't mount the container storage there.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y podman skopeo zstd mtools gdisk xorriso jq btrfs-progs

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load device config
        id: dev
        run: |
          set -euo pipefail
          python3 - "${{ matrix.device }}" >> "$GITHUB_OUTPUT" <<'PY'
          import sys, tomllib
          with open("images/devices.toml", "rb") as f:
              d = tomllib.load(f)[sys.argv[1]]
          print(f"variant={d['variant']}")
          print(f"efi_ia32={'true' if d.get('efi_ia32') else 'false'}")
          PY

      - name: Prepare environment
        run: |
          IMAGE="${IMAGE_REGISTRY,,}/immutable-kiosk-${{ steps.dev.outputs.variant }}:${DEFAULT_TAG}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "INSTALLER=${LOCAL_REGISTRY}/immutable-kiosk-installer-${{ matrix.device }}:latest" >> "$GITHUB_ENV"
          echo "ISO_NAME=immutable-kiosk-installer-${{ matrix.device }}${{ inputs.tag && format('-{0}', inputs.tag) || '' }}.iso" >> "$GITHUB_ENV"

      - name: Build disk image
        uses: osbuild/image-builder-action@a56f95dd77327e604a4f4d9fc06a9641313fda36 # main
        with:
          image_type: raw
          bootc_ref: ${{ env.IMAGE }}
          bootc_default_fs: btrfs

      - name: Check 32-bit UEFI boot files, make the payload
        run: |
          set -euxo pipefail
          RAW=$(sudo find output -iname '*.raw*' -print -quit)
          [[ -n "${RAW}" ]] || { echo "no raw disk image under output/" >&2; sudo find output; exit 1; }
          sudo chown -R "$(id -u):$(id -g)" output
          case "${RAW}" in
            *.xz) xz -d "${RAW}"; RAW=${RAW%.xz} ;;
            *.zst) zstd -d --rm "${RAW}"; RAW=${RAW%.zst} ;;
          esac

          # The installer writes and verifies every byte, empty ones too.
          sudo ./scripts/shrink-raw.sh "${RAW}"

          # Source for any EFI files bootupd left out.
          sudo podman pull "${IMAGE}"
          sudo ./scripts/extract-efi.sh "${IMAGE}" efi
          sudo chown -R "$(id -u):$(id -g)" efi
          if [[ "${{ steps.dev.outputs.efi_ia32 }}" == "true" ]]; then
            ./scripts/ensure-efi-ia32.sh "${RAW}" efi
          fi

          mkdir -p dist
          mv "${RAW}" disk.raw
          sudo rm -rf output
          ./scripts/make-payload.sh disk.raw dist/payload "${IMAGE}" "${{ inputs.tag || 'manual' }}"
          rm -f disk.raw
          mkdir -p release

      # image-builder-action always pulls bootc_ref, and localhost/ images
      # can't be pulled: use a throwaway local registry.
      - name: Start a local registry
        run: |
          set -euxo pipefail
          printf '[[registry]]\nlocation = "%s"\ninsecure = true\n' "${LOCAL_REGISTRY}" |
            sudo tee /etc/containers/registries.conf.d/50-local-registry.conf
          sudo podman run -d --rm --name registry -p "127.0.0.1:5000:5000" docker.io/library/registry:2
          timeout 30 bash -c "until curl -fsS http://${LOCAL_REGISTRY}/v2/ >/dev/null; do sleep 1; done"

      - name: Build and push the installer container
        run: |
          set -euxo pipefail
          sudo podman build --build-arg "BASE_IMAGE=${IMAGE}" --build-arg "VARIANT=${{ steps.dev.outputs.variant }}" \
            --tag "${INSTALLER}" -f installer/Containerfile .
          sudo podman push "${INSTALLER}"
          rm -rf dist/payload

      - name: Build ISO
        uses: osbuild/image-builder-action@a56f95dd77327e604a4f4d9fc06a9641313fda36 # main
        with:
          image_type: bootc-generic-iso
          bootc_ref: ${{ env.INSTALLER }}

      - name: Add 32-bit UEFI boot files, check the ISO
        id: iso
        run: |
          set -euo pipefail
          ISO=$(sudo find output -iname '*.iso' -print -quit)
          [[ -n "${ISO}" ]] || { echo "no ISO produced" >&2; exit 1; }
          if [[ "${{ steps.dev.outputs.efi_ia32 }}" == "true" ]]; then
            # image-builder only puts the x64 shim/GRUB on the ISO.
            sudo mv "${ISO}" iso-x64.iso
            sudo podman run --rm -v "${PWD}:/w" -w /w "${INSTALLER}" \
              bash scripts/iso-add-ia32.sh iso-x64.iso "release/${ISO_NAME}"
            sudo rm -f iso-x64.iso
          else
            sudo mv "${ISO}" "release/${ISO_NAME}"
          fi
          sudo rm -rf output
          sudo chown "$(id -u):$(id -g)" "release/${ISO_NAME}"
          rc=0
          ./scripts/check-iso.sh "release/${ISO_NAME}" installer/iso.yaml || rc=$?
          if [[ ${rc} == 2 && "${{ steps.dev.outputs.efi_ia32 }}" != "true" ]]; then
            rc=0
          fi
          exit "${rc}"

      - name: Prepare release files
        run: |
          set -euo pipefail
          cd release
          sha256sum "${ISO_NAME}" > "${ISO_NAME}.sha256"
          # Release assets are capped at 2 GiB. <iso>.001, .002...: 7-Zip opens
          # .001 as one split file; `cat`/`copy /b` join them too.
          if (( $(stat -c %s "${ISO_NAME}") >= 2147483648 )); then
            split -b 2000M -d -a 3 --numeric-suffixes=1 "${ISO_NAME}" "${ISO_NAME}." && rm -f "${ISO_NAME}"
          fi
          ls -la

      - name: Upload artifacts
        if: inputs.publish != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immutable-kiosk-${{ matrix.device }}-media
          path: release/
          retention-days: 3

      # gh, not action-gh-release, which would also rewrite the release's
      # pre-release/latest flags; --clobber replaces same-named files.
      - name: Attach to release
        if: inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" release/* --clobber --repo "${{ github.repository }}"
