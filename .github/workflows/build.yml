name: Build container image
# Build every variant, rechunk, push, sign, release; build-media.yml then
# makes the disk images and installer ISO.
#
# Channels (Settings -> System -> Update channel):
#   dev branch  -> :dev     + one rolling pre-release (v<fedora>.<commit>);
#   main        -> :latest  + a release (v<fedora>.<date>[.N]).
# A main push with a pre-release's exact tree (dev merged) builds nothing:
# promote.yml promotes the tested image.
# Not released, ISOs kept as run artifacts (the installed system follows the tag):
#   pull request            -> :pr-<number>;
#   by hand on other branch -> :test-<branch>.
# PRs without the signing key (Dependabot, forks) only build. The dev -> main
# PR builds nothing: dev's push run published that tree already.
on:
  pull_request:
    paths-ignore: &ignored
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.github/dependabot.yml'
  schedule:
    - cron: '0 10 1,15 * *'  # picks up Fedora updates in quiet periods
  push:
    branches: [main, dev]
    paths-ignore: *ignored
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover variants
    if: github.head_ref != 'dev'
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.list.outputs.variants }}
      release_tag: ${{ steps.release-tag.outputs.tag }}
      channel: ${{ steps.channel.outputs.channel }}
      image_tag: ${{ steps.channel.outputs.image_tag }}
      released_as: ${{ steps.channel.outputs.released_as }}
      promote_tag: ${{ steps.channel.outputs.promote_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # stable / dev / pr / test / none (never pushed), plus its image tag.
      - name: Compute channel
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
          CAN_SIGN: ${{ secrets.SIGNING_SECRET != '' }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Devices refuse unsigned images: no key, nothing to publish.
            if [[ "${CAN_SIGN}" == "true" ]]; then
              CHANNEL=pr; IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
            else
              CHANNEL=none; IMAGE_TAG=latest
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            CHANNEL=stable; IMAGE_TAG=latest
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            CHANNEL=dev; IMAGE_TAG=dev
          else
            CHANNEL=test
            IMAGE_TAG="test-$(printf '%s' "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9' '-' | tr 'A-Z' 'a-z')"
          fi
          # Newest release with this tree: promote it if still a pre-release.
          # Not on schedule (that run is for Fedora updates).
          SAME="" PROMOTE=""
          if [[ "${CHANNEL}" == "stable" && "${{ github.event_name }}" != "schedule" ]]; then
            TREE=$(git rev-parse 'HEAD^{tree}')
            while IFS=$'\t' read -r TAG PRE; do
              [[ -n "${TAG}" ]] || continue
              if [[ "$(git rev-parse "${TAG}^{tree}" 2>/dev/null)" == "${TREE}" ]]; then
                SAME="${TAG}"
                [[ "${PRE}" == "true" ]] && PROMOTE="${TAG}"
                break
              fi
            done < <(gh release list --limit 20 --json tagName,isPrerelease,isDraft \
                       --jq '.[] | select(.isDraft | not) | "\(.tagName)\t\(.isPrerelease)"')
          fi
          echo "Channel ${CHANNEL}, image tag ${IMAGE_TAG}${SAME:+, same tree as ${SAME}}${PROMOTE:+ (promoting it)}"
          {
            echo "channel=${CHANNEL}"
            echo "image_tag=${IMAGE_TAG}"
            echo "released_as=${SAME}"
            echo "promote_tag=${PROMOTE}"
          } >> "$GITHUB_OUTPUT"

      # v<fedora>.<date>[.N], computed before the build so the image carries it.
      - name: Compute release tag
        id: release-tag
        run: |
          set -euo pipefail
          FEDORA_VER=$(awk -F'[:@]' '/^FROM quay.io\/fedora\/fedora-bootc:/ {print $2; exit}' Containerfile)
          [[ -n "${FEDORA_VER}" ]] || { echo "error: no Fedora version in Containerfile" >&2; exit 1; }
          # Off main: v<fedora>.<commit>; dated tags are stable's.
          if [[ "${{ steps.channel.outputs.channel }}" != "stable" ]]; then
            echo "tag=v${FEDORA_VER}.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREFIX="v${FEDORA_VER}.$(date -u +%Y%m%d)"
          if ! git rev-parse -q --verify "refs/tags/${PREFIX}" >/dev/null \
              && [[ -z "$(git tag -l "${PREFIX}.*")" ]]; then
            TAG="${PREFIX}"
          else
            LAST_NUM=$(git tag -l "${PREFIX}.*" | sed -E "s/^${PREFIX}\.//" | sort -n | tail -1)
            TAG="${PREFIX}.$(( 10#${LAST_NUM:-0} + 1 ))"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # Every top-level table in images/variants.toml IS a variant.
      - name: List variants
        id: list
        run: |
          set -euo pipefail
          variants=$(python3 -c '
          import json, tomllib
          with open("images/variants.toml", "rb") as f:
              data = tomllib.load(f)
          print(json.dumps(sorted(v["suffix"] for v in data.values())))
          ')
          echo "Discovered variants: ${variants}"
          echo "variants=${variants}" >> "$GITHUB_OUTPUT"

  build_push:
    name: Build and push image (${{ matrix.variant }})
    needs: discover
    if: needs.discover.outputs.released_as == ''
    strategy:
      matrix:
        variant: ${{ fromJson(needs.discover.outputs.variants) }}
      fail-fast: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        run: just check

      - name: Image Name
        run: echo "IMAGE_NAME=immutable-kiosk-${{ matrix.variant }}" >> $GITHUB_ENV

      - name: Default Tag
        run: echo "DEFAULT_TAG=${{ needs.discover.outputs.image_tag }}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Build Image
        env:
          RELEASE_TAG: ${{ needs.discover.outputs.release_tag }}
        run: just build ${{ matrix.variant }} ${IMAGE_NAME} ${DEFAULT_TAG}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: needs.discover.outputs.channel != 'none'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check package changes
        id: check-changes
        if: needs.discover.outputs.channel == 'stable' || needs.discover.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW_IMAGE="${IMAGE_NAME}:${DEFAULT_TAG}"
          PKG_CHANGELOG="/tmp/package-changelog-${{ matrix.variant }}.md"
          # Diff against the current stable release on both channels.
          PREV_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          PREV_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:no-previous-release"
          if [[ -n "${PREV_TAG}" ]]; then
            # Its version tag; older builds only have latest-/dev-<sha>.
            while IFS= read -r CANDIDATE_REF; do
              if podman pull --quiet "${CANDIDATE_REF}" >/dev/null 2>&1; then
                PREV_IMAGE="${CANDIDATE_REF}"
                break
              fi
            done < <(echo "${IMAGE_REGISTRY}/${IMAGE_NAME}:${PREV_TAG}"
                     git log --format='%h' "${PREV_TAG}" | head -50 |
                       sed -e "s|^|${IMAGE_REGISTRY}/${IMAGE_NAME}:latest-|p" -e "s|:latest-|:dev-|")
          fi
          ./scripts/diff-packages.sh "${PREV_IMAGE}" "${NEW_IMAGE}" "${PKG_CHANGELOG}" "${PKG_CHANGELOG%.md}.tsv"
          if grep -qx 'No package changes\.' "${PKG_CHANGELOG}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload changelog artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check-changes.outcome == 'success'
        with:
          name: changelog-${{ matrix.variant }}
          path: |
            /tmp/package-changelog-${{ matrix.variant }}.md
            /tmp/package-changelog-${{ matrix.variant }}.tsv
          retention-days: 1

      # Not when never pushed, nor when a scheduled run found no package change.
      - name: Decide whether to push
        id: publish
        run: |
          if [[ "${{ needs.discover.outputs.channel }}" == "none" ]] ||
             [[ "${{ github.event_name }}" == "schedule" && "${{ steps.check-changes.outputs.changed }}" == "false" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rechunk with chunkah
        if: steps.publish.outputs.push == 'true'
        run: just rechunk ${IMAGE_NAME} ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        if: steps.publish.outputs.push == 'true'
        run: |
          alias_tags="$(just generate-build-tags ${IMAGE_NAME} ${DEFAULT_TAG})"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        if: steps.publish.outputs.push == 'true'
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: just tag-images "${IMAGE_NAME}" "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      # Push once, then skopeo the other tags: each podman push makes a new
      # digest, which would leave tags unsigned.
      - name: Push To GHCR
        if: steps.publish.outputs.push == 'true'
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
          CHANNEL: ${{ needs.discover.outputs.channel }}
          RELEASE_TAG: ${{ needs.discover.outputs.release_tag }}
        run: |
          set -euox pipefail
          podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:${DEFAULT_TAG}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          digest=$(< /tmp/digestfile)
          TAGS="${ALIAS_TAGS}"
          # Version tag: promote.yml and the package diff rely on it.
          if [[ "${CHANNEL}" == "stable" || "${CHANNEL}" == "dev" ]]; then
            TAGS+=" ${RELEASE_TAG}"
          fi
          for tag in ${TAGS}; do
            [[ "${tag}" == "${DEFAULT_TAG}" ]] && continue
            # Off main: only <channel tag>-* and the version tag.
            if [[ "${CHANNEL}" != "stable" && "${tag}" != "${DEFAULT_TAG}"-* && "${tag}" != "${RELEASE_TAG}" ]]; then
              continue
            fi
            skopeo copy --all "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${digest}" "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Upload published marker
        if: steps.push-image.outcome == 'success' && (needs.discover.outputs.channel == 'stable' || needs.discover.outputs.channel == 'dev')
        run: touch published.marker

      - name: Upload published marker artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.push-image.outcome == 'success' && (needs.discover.outputs.channel == 'stable' || needs.discover.outputs.channel == 'dev')
        with:
          name: published-${{ matrix.variant }}
          path: published.marker
          retention-days: 1

      # Sign pr-* and test-* too: devices refuse unsigned images, even on `bootc switch`.
      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        if: steps.push-image.outcome == 'success'
        with:
          cosign-release: 'v3.1.2'

      - name: Sign container image
        if: steps.push-image.outcome == 'success'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

  aggregate:
    name: Check publish status
    needs: [discover, build_push]
    if: ${{ !cancelled() && needs.build_push.result == 'success' && (needs.discover.outputs.channel == 'stable' || needs.discover.outputs.channel == 'dev') }}
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Download publish markers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: published-*
          path: publish-markers
          merge-multiple: true

      - name: Check publish status
        id: check
        run: |
          if [[ -n "$(ls -A publish-markers 2>/dev/null)" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  release-meta:
    name: Publish release
    needs: [discover, build_push, aggregate]
    if: ${{ !cancelled() && needs.aggregate.result == 'success' && needs.aggregate.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true


      - name: Download changelog artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: changelog-*
          path: changelog-artifacts
          merge-multiple: true

      - name: Generate changelog
        env:
          VARIANTS: ${{ needs.discover.outputs.variants }}
          CHANNEL: ${{ needs.discover.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t VARIANT_LIST < <(echo "${VARIANTS}" | jq -r '.[]')
          : > changelog.md
          if [[ "${CHANNEL}" == "dev" ]]; then
            {
              echo "> Testing build (**dev** channel, \`dev\` branch): every newer change replaces it."
              echo "> It becomes stable when \`dev\` is merged into \`main\`, or when *Pre-release* is unchecked."
              echo
            } >> changelog.md
          fi
          ./scripts/merge-changelogs.sh changelog-artifacts "${VARIANT_LIST[@]}" >> changelog.md
          {
            echo "## Installation"
            echo
            echo "1. Download \`immutable-kiosk-installer-<device>-<tag>.iso\`. An ISO over 2 GiB comes in parts,"
            echo "   \`….iso.001\`, \`….iso.002\`, …: download them all into one folder and open \`.001\` in 7-Zip / NanaZip"
            echo "   → *Extract* gives the one ISO. Without a tool: \`copy /b <file>.iso.001 + <file>.iso.002 <file>.iso\` (Windows),"
            echo "   \`cat <file>.iso.0* > <file>.iso\` (Linux). The whole ISO's checksum: \`.sha256\`."
            echo "2. Write the ISO to a USB stick (Fedora Media Writer, Rufus in DD mode, \`dd\`)."
            echo "3. Connect the stick and the charger to the tablet through a USB-OTG hub and boot from the stick"
            echo "   (HP: hold *Volume −* while powering on)."
            echo "4. The installer picks the internal eMMC itself → hold the install button for 3 s. When it's done, pull the stick and restart."
            echo "5. The first start opens Settings: Wi-Fi → HMI address → *Save and open HMI*."
            echo "   Later, to get to Settings: hold the top-right corner of the screen for ~1 s (the corner is set under *Display*)."
            echo
          } >> changelog.md
          # Commits since the stable release, grouped by type (feat:, fix:).
          PREV_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [[ -n "${PREV_TAG}" ]]; then
            git log --no-merges --pretty='%h %s' "${PREV_TAG}..HEAD" > commits.txt
          else
            git log --no-merges --pretty='%h %s' -1 > commits.txt
          fi
          TYPE='(\([^)]*\))?!?: *'
          section() {  # <title> <type>
            local lines
            lines=$(grep -E "^[0-9a-f]+ $2${TYPE}" commits.txt | sed -E "s/^([0-9a-f]+) $2${TYPE}/- \1 /" || true)
            if [[ -n "${lines}" ]]; then printf '### %s\n\n%s\n\n' "$1" "${lines}"; fi
          }
          {
            echo "## Commits"
            echo
            section "Features" feat
            section "Fixes" fix
            others=$(grep -Ev "^[0-9a-f]+ (feat|fix)${TYPE}" commits.txt | sed 's/^/- /' || true)
            if [[ -n "${others}" ]]; then printf '### %s\n\n%s\n' "Other changes" "${others}"; fi
          } >> changelog.md

      - name: Create release tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ needs.discover.outputs.release_tag }}"
          if [[ "${{ needs.discover.outputs.channel }}" == "dev" ]]; then
            # A rebuilt commit updates its pre-release in place.
            git tag -f -a "${TAG}" -m "${TAG}"
            git push -f origin "${TAG}"
          else
            git tag -a "${TAG}" -m "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.discover.outputs.release_tag }}
          name: ${{ needs.discover.outputs.release_tag }}${{ needs.discover.outputs.channel == 'dev' && ' (dev)' || '' }}
          body_path: changelog.md
          prerelease: ${{ needs.discover.outputs.channel == 'dev' }}
          make_latest: ${{ needs.discover.outputs.channel == 'stable' && 'true' || 'false' }}

      # Only one pre-release (and tag) at a time; images stay in the registry.
      - name: Remove older pre-releases
        if: needs.discover.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.discover.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release list --limit 50 --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease) | .tagName' |
            while IFS= read -r OLD; do
              [[ -z "${OLD}" || "${OLD}" == "${TAG}" ]] && continue
              echo "Removing pre-release ${OLD}"
              gh release delete "${OLD}" --cleanup-tag --yes
            done

  # Attached to the release; pr-* and test-* ISOs stay run artifacts.
  build-media:
    name: Build installer ISOs
    needs: [discover, build_push, release-meta]
    if: ${{ !cancelled() && (needs.release-meta.result == 'success' || (needs.build_push.result == 'success' && (needs.discover.outputs.channel == 'pr' || needs.discover.outputs.channel == 'test'))) }}
    uses: ./.github/workflows/build-media.yml
    with:
      publish: ${{ needs.release-meta.result == 'success' }}
      tag: ${{ needs.discover.outputs.release_tag }}
      # The tag the installed system then follows.
      image_tag: ${{ needs.discover.outputs.image_tag }}
    permissions:
      contents: write

  promote:
    name: Promote ${{ needs.discover.outputs.promote_tag }} to stable
    needs: discover
    if: needs.discover.outputs.promote_tag != ''
    uses: ./.github/workflows/promote.yml
    with:
      tag: ${{ needs.discover.outputs.promote_tag }}
    permissions:
      contents: write
      packages: write
