name: Build container image
# Same pipeline as immutable-sbc, minus its deps image (the x86 kiosk runs
# Fedora's own kernel, nothing out-of-tree): build every variant, rechunk,
# push, sign; then publish a release and hand over to build-media.yml for the
# disk images and the installer ISO.
#
# Channels (what a kiosk follows -- Settings -> System -> Kanał):
#   dev branch  -> :dev     + one rolling pre-release, replaced by every build;
#   main        -> :latest  + a release (stable).
# A main push whose tree is a pre-release's tree (dev merged into main) builds
# nothing: promote.yml moves :latest to the image that was tested on dev and
# turns that pre-release into the release. Other branches: testing-<branch>.
on:
  pull_request:
    paths-ignore: &ignored
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.github/dependabot.yml'
  schedule:
    - cron: '0 10 1,15 * *'  # ~every 2 weeks: catches Fedora updates in quiet periods
  push:
    # Dependabot's branch pushes get no SIGNING_SECRET; its PR run builds the change.
    branches-ignore:
      - 'dependabot/**'
    paths-ignore: *ignored
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover variants
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.list.outputs.variants }}
      release_tag: ${{ steps.release-tag.outputs.tag }}
      channel: ${{ steps.channel.outputs.channel }}
      image_tag: ${{ steps.channel.outputs.image_tag }}
      released_as: ${{ steps.channel.outputs.released_as }}
      promote_tag: ${{ steps.channel.outputs.promote_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # stable / dev / testing (other branches) / none (pull requests: never
      # pushed), and the image tag it publishes. On main, a pre-release with
      # this exact tree is promoted instead of rebuilt (see the header).
      - name: Compute channel
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANNEL=none; IMAGE_TAG=latest
          elif [[ "${{ github.ref }}" == "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            CHANNEL=stable; IMAGE_TAG=latest
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            CHANNEL=dev; IMAGE_TAG=dev
          else
            CHANNEL=testing
            IMAGE_TAG="testing-$(printf '%s' "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9' '-' | tr 'A-Z' 'a-z')"
          fi
          # The newest release with this exact tree: a pre-release is promoted;
          # one already promoted (on GitHub, before the merge) needs nothing.
          # Not on schedule: that run exists to pick up Fedora's updates.
          SAME="" PROMOTE=""
          if [[ "${CHANNEL}" == "stable" && "${{ github.event_name }}" != "schedule" ]]; then
            TREE=$(git rev-parse 'HEAD^{tree}')
            while IFS=$'\t' read -r TAG PRE; do
              [[ -n "${TAG}" ]] || continue
              if [[ "$(git rev-parse "${TAG}^{tree}" 2>/dev/null)" == "${TREE}" ]]; then
                SAME="${TAG}"
                [[ "${PRE}" == "true" ]] && PROMOTE="${TAG}"
                break
              fi
            done < <(gh release list --limit 20 --json tagName,isPrerelease,isDraft \
                       --jq '.[] | select(.isDraft | not) | "\(.tagName)\t\(.isPrerelease)"')
          fi
          echo "Channel ${CHANNEL}, image tag ${IMAGE_TAG}${SAME:+, same tree as ${SAME}}${PROMOTE:+ (promoting it)}"
          {
            echo "channel=${CHANNEL}"
            echo "image_tag=${IMAGE_TAG}"
            echo "released_as=${SAME}"
            echo "promote_tag=${PROMOTE}"
          } >> "$GITHUB_OUTPUT"

      # Release tag = Fedora version + date, .1/.2/... for a same-day repeat.
      # Computed before the build, so the image carries it (label + os-release:
      # Settings and the GRUB entry show it); release-meta tags with the same.
      - name: Compute release tag
        id: release-tag
        run: |
          set -euo pipefail
          FEDORA_VER=$(awk -F'[:@]' '/^FROM quay.io\/fedora\/fedora-bootc:/ {print $2; exit}' Containerfile)
          [[ -n "${FEDORA_VER}" ]] || { echo "error: no Fedora version in Containerfile" >&2; exit 1; }
          PREFIX="v${FEDORA_VER}.$(date -u +%Y%m%d)"
          if ! git rev-parse -q --verify "refs/tags/${PREFIX}" >/dev/null \
              && [[ -z "$(git tag -l "${PREFIX}.*")" ]]; then
            TAG="${PREFIX}"
          else
            LAST_NUM=$(git tag -l "${PREFIX}.*" | sed -E "s/^${PREFIX}\.//" | sort -n | tail -1)
            TAG="${PREFIX}.$(( 10#${LAST_NUM:-0} + 1 ))"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # Every top-level table in images/variants.toml IS a variant.
      - name: List variants
        id: list
        run: |
          set -euo pipefail
          variants=$(python3 -c '
          import json, tomllib
          with open("images/variants.toml", "rb") as f:
              data = tomllib.load(f)
          print(json.dumps(sorted(v["suffix"] for v in data.values())))
          ')
          echo "Discovered variants: ${variants}"
          echo "variants=${variants}" >> "$GITHUB_OUTPUT"

  build_push:
    name: Build and push image (${{ matrix.variant }})
    needs: discover
    if: needs.discover.outputs.released_as == ''
    strategy:
      matrix:
        variant: ${{ fromJson(needs.discover.outputs.variants) }}
      fail-fast: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        run: just check

      - name: Image Name
        run: echo "IMAGE_NAME=immutable-kiosk-${{ matrix.variant }}" >> $GITHUB_ENV

      - name: Default Tag
        run: echo "DEFAULT_TAG=${{ needs.discover.outputs.image_tag }}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Build Image
        env:
          RELEASE_TAG: ${{ needs.discover.outputs.release_tag }}
        run: just build ${{ matrix.variant }} ${IMAGE_NAME} ${DEFAULT_TAG}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: needs.discover.outputs.channel != 'none'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check package changes
        id: check-changes
        if: needs.discover.outputs.channel == 'stable' || needs.discover.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW_IMAGE="${IMAGE_NAME}:${DEFAULT_TAG}"
          PKG_CHANGELOG="/tmp/package-changelog-${{ matrix.variant }}.md"
          # Against the current stable release on both channels: a
          # pre-release lists everything it would bring to stable.
          PREV_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          PREV_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:no-previous-release"
          if [[ -n "${PREV_TAG}" ]]; then
            # Its version tag; builds from before the channels only have
            # latest-<sha> (dev-<sha> since).
            while IFS= read -r CANDIDATE_REF; do
              if podman pull --quiet "${CANDIDATE_REF}" >/dev/null 2>&1; then
                PREV_IMAGE="${CANDIDATE_REF}"
                break
              fi
            done < <(echo "${IMAGE_REGISTRY}/${IMAGE_NAME}:${PREV_TAG}"
                     git log --format='%h' "${PREV_TAG}" | head -50 |
                       sed -e "s|^|${IMAGE_REGISTRY}/${IMAGE_NAME}:latest-|p" -e "s|:latest-|:dev-|")
          fi
          ./scripts/diff-packages.sh "${PREV_IMAGE}" "${NEW_IMAGE}" "${PKG_CHANGELOG}" "${PKG_CHANGELOG%.md}.tsv"
          if grep -qx 'No package changes\.' "${PKG_CHANGELOG}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload changelog artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check-changes.outcome == 'success'
        with:
          name: changelog-${{ matrix.variant }}
          path: |
            /tmp/package-changelog-${{ matrix.variant }}.md
            /tmp/package-changelog-${{ matrix.variant }}.tsv
          retention-days: 1

      - name: Rechunk with chunkah
        if: github.event_name != 'pull_request' && !(github.event_name == 'schedule' && steps.check-changes.outputs.changed == 'false')
        run: just rechunk ${IMAGE_NAME} ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        if: github.event_name != 'pull_request' && !(github.event_name == 'schedule' && steps.check-changes.outputs.changed == 'false')
        run: |
          alias_tags="$(just generate-build-tags ${IMAGE_NAME} ${DEFAULT_TAG})"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        if: github.event_name != 'pull_request' && !(github.event_name == 'schedule' && steps.check-changes.outputs.changed == 'false')
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: just tag-images "${IMAGE_NAME}" "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      # Push once, add the other tags with skopeo: every podman push makes a
      # new digest, which left :latest unsigned in lm-server (see its history).
      - name: Push To GHCR
        if: needs.discover.outputs.channel != 'none' && !(github.event_name == 'schedule' && steps.check-changes.outputs.changed == 'false')
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
          CHANNEL: ${{ needs.discover.outputs.channel }}
          RELEASE_TAG: ${{ needs.discover.outputs.release_tag }}
        run: |
          set -euox pipefail
          podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:${DEFAULT_TAG}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          digest=$(< /tmp/digestfile)
          TAGS="${ALIAS_TAGS}"
          # The version tag: what promote.yml moves :latest to, and the
          # package diff's previous release.
          if [[ "${CHANNEL}" == "stable" || "${CHANNEL}" == "dev" ]]; then
            TAGS+=" ${RELEASE_TAG}"
          fi
          for tag in ${TAGS}; do
            [[ "${tag}" == "${DEFAULT_TAG}" ]] && continue
            # Off main only <channel tag>-* (and the version): the bare
            # date tags are stable's.
            if [[ "${CHANNEL}" != "stable" && "${tag}" != "${DEFAULT_TAG}"-* && "${tag}" != "${RELEASE_TAG}" ]]; then
              continue
            fi
            skopeo copy --all "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${digest}" "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Upload published marker
        if: steps.push-image.outcome == 'success' && (needs.discover.outputs.channel == 'stable' || needs.discover.outputs.channel == 'dev')
        run: touch published.marker

      - name: Upload published marker artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.push-image.outcome == 'success' && (needs.discover.outputs.channel == 'stable' || needs.discover.outputs.channel == 'dev')
        with:
          name: published-${{ matrix.variant }}
          path: published.marker
          retention-days: 1

      # Signed even for testing-* tags: a deployed system refuses unsigned
      # ghcr.io/lukemech images, `bootc switch` to a test branch included.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.push-image.outcome == 'success'
        with:
          cosign-release: 'v3.1.2'

      - name: Sign container image
        if: steps.push-image.outcome == 'success'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

  aggregate:
    name: Check publish status
    needs: [discover, build_push]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.build_push.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Download publish markers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: published-*
          path: publish-markers
          merge-multiple: true

      - name: Check publish status
        id: check
        run: |
          if [[ -n "$(ls -A publish-markers 2>/dev/null)" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  release-meta:
    name: Publish release
    needs: [discover, build_push, aggregate]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.aggregate.result == 'success' && needs.aggregate.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.discover.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true


      - name: Download changelog artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: changelog-*
          path: changelog-artifacts
          merge-multiple: true

      - name: Generate changelog
        env:
          VARIANTS: ${{ needs.discover.outputs.variants }}
          CHANNEL: ${{ needs.discover.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t VARIANT_LIST < <(echo "${VARIANTS}" | jq -r '.[]')
          : > changelog.md
          if [[ "${CHANNEL}" == "dev" ]]; then
            {
              echo "> Wersja testowa (kanał **dev**, gałąź \`dev\`): zastępuje ją każda kolejna zmiana."
              echo "> Stabilna staje się po scaleniu \`dev\` do \`main\` albo po odznaczeniu *Pre-release*."
              echo
            } >> changelog.md
          fi
          ./scripts/merge-changelogs.sh changelog-artifacts "${VARIANT_LIST[@]}" >> changelog.md
          {
            echo "## Instalacja"
            echo
            echo "1. Pobierz \`immutable-kiosk-installer-<urządzenie>-<tag>.iso\`. Jeśli ISO ma ponad 2 GiB, jest podzielone na"
            echo "   \`….iso.001\`, \`….iso.002\`, …: pobierz wszystkie części do jednego folderu i otwórz \`.001\` w 7-Zip / NanaZip"
            echo "   → *Wypakuj* daje jedno ISO. Bez programu: \`copy /b <plik>.iso.001 + <plik>.iso.002 <plik>.iso\` (Windows),"
            echo "   \`cat <plik>.iso.0* > <plik>.iso\` (Linux). Suma kontrolna całego ISO: \`.sha256\`."
            echo "2. Zapisz ISO na pendrive (Fedora Media Writer, Rufus w trybie DD, \`dd\`)."
            echo "3. Podłącz pendrive i ładowarkę do tabletu przez hub USB-OTG, uruchom z pendrive'a"
            echo "   (HP: *Volume −* przytrzymany przy włączaniu)."
            echo "4. Instalator sam wybiera wewnętrzne eMMC → przytrzymaj przycisk instalacji 3 s. Po zakończeniu wyjmij pendrive i uruchom ponownie."
            echo "5. Pierwszy start otwiera Ustawienia: Wi-Fi → adres HMI → *Zapisz i otwórz HMI*."
            echo "   Później do Ustawień: przytrzymaj ~1 s prawy górny róg ekranu (róg zmienisz w *Ekran*)."
            echo
            echo "## Commits"
            echo
          } >> changelog.md
          # Since the current stable release (a pre-release: all it would add).
          PREV_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [[ -n "${PREV_TAG}" ]]; then
            git log --pretty='- %h %s' "${PREV_TAG}..HEAD" >> changelog.md
          else
            git log --pretty='- %h %s' -1 >> changelog.md
          fi

      - name: Create release tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ needs.discover.outputs.release_tag }}"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.discover.outputs.release_tag }}
          name: ${{ needs.discover.outputs.release_tag }}${{ needs.discover.outputs.channel == 'dev' && ' (dev)' || '' }}
          body_path: changelog.md
          prerelease: ${{ needs.discover.outputs.channel == 'dev' }}
          make_latest: ${{ needs.discover.outputs.channel == 'stable' && 'true' || 'false' }}

      # One pre-release at a time: the one just published replaces the
      # others (and their tags; their images stay in the registry).
      - name: Remove older pre-releases
        if: needs.discover.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.discover.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release list --limit 50 --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease) | .tagName' |
            while IFS= read -r OLD; do
              [[ -z "${OLD}" || "${OLD}" == "${TAG}" ]] && continue
              echo "Removing pre-release ${OLD}"
              gh release delete "${OLD}" --cleanup-tag --yes
            done

  build-media:
    name: Build installer ISOs
    needs: [discover, build_push, release-meta]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.release-meta.result == 'success' }}
    uses: ./.github/workflows/build-media.yml
    with:
      publish: true
      tag: ${{ needs.release-meta.outputs.tag }}
      # What the installed system then follows: the channel's tag.
      image_tag: ${{ needs.discover.outputs.image_tag }}
    permissions:
      contents: write

  promote:
    name: Promote ${{ needs.discover.outputs.promote_tag }} to stable
    needs: discover
    if: needs.discover.outputs.promote_tag != ''
    uses: ./.github/workflows/promote.yml
    with:
      tag: ${{ needs.discover.outputs.promote_tag }}
    permissions:
      contents: write
      packages: write
