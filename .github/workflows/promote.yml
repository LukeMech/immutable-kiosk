name: Promote to stable
# Promotes a dev pre-release to stable without a rebuild: :latest moves to
# the same digest (so its signature still holds) and ISOs are rebuilt from
# :latest (a dev ISO would follow :dev).
# Runs on dev merged into main (via build.yml), on unchecking "Set as a
# pre-release" on GitHub, or by hand (empty tag: newest pre-release).
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag (empty: the newest pre-release)"
        type: string
        default: ""
      media:
        description: "Rebuild its installer ISOs from :latest"
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

jobs:
  promote:
    name: Move :latest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ -z "${TAG}" ]]; then
            TAG=$(gh release list --limit 20 --json tagName,isPrerelease,isDraft \
                    --jq '[.[] | select(.isPrerelease and (.isDraft | not))][0].tagName // ""')
            [[ -n "${TAG}" ]] || { echo "error: no pre-release to promote" >&2; exit 1; }
          fi
          gh release view "${TAG}" --json tagName >/dev/null
          echo "Promoting ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move :latest to the release's images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          REGISTRY="${IMAGE_REGISTRY,,}"
          mapfile -t VARIANTS < <(python3 -c '
          import tomllib
          with open("images/variants.toml", "rb") as f:
              print("\n".join(sorted(v["suffix"] for v in tomllib.load(f).values())))
          ')
          SHA=$(git rev-parse --short=7 "${TAG}^{commit}")
          for VARIANT in "${VARIANTS[@]}"; do
            REPO="${REGISTRY}/immutable-kiosk-${VARIANT}"
            # Older releases only have <channel>-<sha> tags.
            DIGEST=""
            for REF in "${TAG}" "dev-${SHA}" "latest-${SHA}"; do
              DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${REPO}:${REF}" 2>/dev/null) && break
              DIGEST=""
            done
            [[ -n "${DIGEST}" ]] || { echo "error: no ${REPO} image for ${TAG}" >&2; exit 1; }
            skopeo copy --all --preserve-digests "docker://${REPO}@${DIGEST}" "docker://${REPO}:latest"
            NOW=$(skopeo inspect --format '{{.Digest}}' "docker://${REPO}:latest")
            if [[ "${NOW}" != "${DIGEST}" ]]; then
              echo "error: ${REPO}:latest is ${NOW}, not ${DIGEST} (the signed one)" >&2
              exit 1
            fi
            echo "${REPO}:latest -> ${TAG} (${DIGEST})"
          done

      # Retag v<fedora>.<commit> as v<fedora>.<date>[.N] (release and images);
      # the old tag and its ISOs go (media rebuilds them).
      - name: Make it the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          MEDIA: ${{ github.event_name != 'workflow_dispatch' || inputs.media }}
        run: |
          set -euo pipefail
          NEW="${TAG}"
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]{8}(\.[0-9]+)?$ ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            FEDORA_VER=$(git show "${TAG}:Containerfile" | awk -F'[:@]' '/^FROM quay.io\/fedora\/fedora-bootc:/ {print $2; exit}')
            PREFIX="v${FEDORA_VER}.$(date -u +%Y%m%d)"
            if ! git rev-parse -q --verify "refs/tags/${PREFIX}" >/dev/null \
                && [[ -z "$(git tag -l "${PREFIX}.*")" ]]; then
              NEW="${PREFIX}"
            else
              LAST_NUM=$(git tag -l "${PREFIX}.*" | sed -E "s/^${PREFIX}\.//" | sort -n | tail -1)
              NEW="${PREFIX}.$(( 10#${LAST_NUM:-0} + 1 ))"
            fi
            git tag -a "${NEW}" -m "${NEW}" "${TAG}^{commit}"
            git push origin "${NEW}"
            REGISTRY="${IMAGE_REGISTRY,,}"
            for VARIANT in $(python3 -c '
          import tomllib
          with open("images/variants.toml", "rb") as f:
              print(" ".join(sorted(v["suffix"] for v in tomllib.load(f).values())))
          '); do
              REPO="${REGISTRY}/immutable-kiosk-${VARIANT}"
              skopeo copy --all --preserve-digests "docker://${REPO}:latest" "docker://${REPO}:${NEW}"
            done
          fi
          # Drop build.yml's "> Testing build..." lead.
          gh release view "${TAG}" --json body --jq .body | sed '/^> /d' | sed '/./,$!d' > notes.md
          gh release edit "${TAG}" --tag "${NEW}" --prerelease=false --latest --title "${NEW}" --notes-file notes.md
          if [[ "${NEW}" != "${TAG}" ]]; then
            git push origin ":refs/tags/${TAG}"
            if [[ "${MEDIA}" == "true" ]]; then
              ASSETS=$(gh release view "${NEW}" --json assets --jq '.assets[].name')
              while IFS= read -r ASSET; do
                if [[ "${ASSET}" == *"-${TAG}."* ]]; then
                  gh release delete-asset "${NEW}" "${ASSET}" --yes
                fi
              done <<< "${ASSETS}"
            fi
          fi
          echo "Released as ${NEW}"
          echo "tag=${NEW}" >> "$GITHUB_OUTPUT"

  media:
    name: Installer ISOs from :latest
    needs: promote
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.media }}
    uses: ./.github/workflows/build-media.yml
    with:
      publish: true
      tag: ${{ needs.promote.outputs.tag }}
      image_tag: latest
    permissions:
      contents: write
