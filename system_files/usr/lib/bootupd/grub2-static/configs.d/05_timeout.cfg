# immutable-kiosk: GRUB menu for 3 s instead of bootupd's 1 s -- enough to
# pick the previous deployment from a USB keyboard when one is plugged in.
# bootupd concatenates grub-static-pre.cfg + configs.d/*.cfg into
# /boot/grub2/grub.cfg only at install time, so a change here reaches new
# installs, not devices already installed.
set timeout_style=menu
set timeout=3
