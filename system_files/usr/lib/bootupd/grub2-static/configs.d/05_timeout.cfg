# immutable-kiosk: no visible GRUB menu. The tablet's volume keys move the
# selection but nothing on it can confirm one, and any key stops the
# countdown -- the menu just sat there. "hidden" ignores those keys; Esc / F4
# / holding Shift on a USB keyboard still opens it.
# bootupd concatenates grub-static-pre.cfg + configs.d/*.cfg into
# /boot/grub2/grub.cfg only at install time, so this reaches new installs;
# boot-counter writes the same into /boot/grub2/custom.cfg (sourced at the
# end, 41_custom.cfg) on every boot, which covers installed devices too.
set timeout_style=hidden
set timeout=1
