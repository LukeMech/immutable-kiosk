# immutable-kiosk: no Bluetooth. Nothing in the kiosk uses it, and loading
# it costs boot time and fails noisily where its firmware isn't shipped
# (Bay Trail tablets' serial Broadcom: "hci0: BCM: firmware Patch file not
# found"). The drivers that would pull in the stack are kept from loading.
blacklist hci_uart
blacklist btusb
blacklist btbcm
blacklist btintel
blacklist btrtl
blacklist btmtk
blacklist bluetooth
