#Type Path                          Mode Owner Group Age
d     /var/home/kiosk               0700 kiosk kiosk -
# kioskd's state: config.json (HMI URL, rotation, ...). Readable by
# kiosk-shell, written only by kioskd (root).
d     /var/lib/immutable-kiosk      0755 root  root  -
# udev's hardware database lives in /usr (05-base.sh): an /etc copy left
# from before would win over it and make systemd-hwdb-update rebuild it
# (3 s on the Atom) on the first boot after every update.
r     /etc/udev/hwdb.bin
