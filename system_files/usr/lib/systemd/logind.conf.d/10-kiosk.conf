# Short press of the tablet's power button must not shut down or suspend a
# wall-mounted HMI by accident. Power off/reboot are in Settings > System;
# a long press (firmware-level, ~4 s) still forces it off.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
IdleAction=ignore
# No login prompt on any VT, ever (getty@tty1/autovt@tty1 are masked too):
# nobody can log in anyway. Debugging: systemd.debug_shell=1 (tty9).
NAutoVTs=0
ReserveVT=0
