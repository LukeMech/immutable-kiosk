# A short power-key press must not shut down the HMI (use Settings > System);
# a ~4 s press still forces it off.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
IdleAction=ignore
# No VT logins. Debugging: systemd.debug_shell=1 (tty9), without
# drm_kms_helper.fbdev_emulation=0 (kargs.d/10-kiosk.toml: no VT shows otherwise).
NAutoVTs=0
ReserveVT=0
