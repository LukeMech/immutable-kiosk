# Quiet boot with the Plymouth splash (15-plymouth.sh), no cursor; none on serial consoles.
# audit=0: no kernel audit records (nothing collects them: no auditd); they
# were the "audit: type=..." lines on the console.
kargs = ["quiet", "loglevel=3", "vt.global_cursor_default=0", "consoleblank=0", "splash", "plymouth.ignore-serial-consoles", "audit=0"]
